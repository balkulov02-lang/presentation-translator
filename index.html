<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GB History — Presentation Translator</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      color: #1f2937;
    }

    header {
      background: #172554;
      color: white;
      padding: 18px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .subtitle {
      font-size: 14px;
      opacity: 0.8;
    }

    .container {
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 20px;
    }

    .upload-box {
      background: white;
      border-radius: 16px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .upload-box h2 {
      margin-top: 0;
    }

    #fileInput {
      display: none;
    }

    .upload-button {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 13px 25px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }

    .upload-button:hover {
      background: #1d4ed8;
    }

    #status {
      margin-top: 15px;
      color: #64748b;
    }

    .workspace {
      display: none;
      grid-template-columns: 1fr 300px;
      gap: 20px;
      align-items: start;
    }

    .presentation-area {
      background: #dfe4ea;
      border-radius: 16px;
      padding: 25px;
      min-height: 600px;
    }

    .slide {
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16 / 9;
      background: white;
      margin: auto;
      border-radius: 5px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      position: relative;
      overflow: hidden;
      padding: 45px;
    }

    .slide-title {
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .slide-content {
      font-size: 22px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .word {
      cursor: pointer;
      display: inline-block;
      border-radius: 4px;
      padding: 0 2px;
      transition: 0.15s;
    }

    .word:hover {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 20px;
    }

    .controls button {
      border: none;
      background: #172554;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .controls button:hover {
      background: #1e40af;
    }

    #slideNumber {
      font-weight: bold;
    }

    .translation-panel {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      position: sticky;
      top: 20px;
    }

    .translation-panel h3 {
      margin-top: 0;
      color: #172554;
    }

    .selected-word {
      font-size: 25px;
      font-weight: bold;
      margin: 15px 0;
      word-break: break-word;
    }

    .translation {
      background: #f1f5f9;
      border-radius: 10px;
      padding: 15px;
      min-height: 70px;
      font-size: 20px;
    }

    .speak-button {
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #16a34a;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .speak-button:hover {
      background: #15803d;
    }

    .slide-list {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
    }

    .slide-thumb {
      min-width: 100px;
      height: 65px;
      background: white;
      border: 2px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      padding: 5px;
      overflow: hidden;
      font-size: 9px;
    }

    .slide-thumb.active {
      border-color: #2563eb;
    }

    .loading {
      display: none;
      margin-top: 15px;
      color: #2563eb;
      font-weight: bold;
    }

    .error {
      color: #dc2626;
      font-weight: bold;
    }

    @media (max-width: 800px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .translation-panel {
        position: static;
      }

      .slide {
        padding: 25px;
      }

      .slide-title {
        font-size: 22px;
      }

      .slide-content {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

<header>
  <div>
    <div class="logo">GB History</div>
    <div class="subtitle">Presentation Translator</div>
  </div>
</header>

<div class="container">

  <div class="upload-box">

    <h2>📚 Презентацияны жүктеу</h2>

    <p>
      PowerPoint презентациясын таңдаңыз (.pptx)
    </p>

    <label for="fileInput" class="upload-button">
      📂 Презентация таңдау
    </label>

    <input
      type="file"
      id="fileInput"
      accept=".pptx"
    >

    <div id="status">
      Файл таңдалмаған
    </div>

    <div id="loading" class="loading">
      ⏳ Презентация оқылуда...
    </div>

  </div>


  <div id="workspace" class="workspace">

    <div>

      <div class="presentation-area">

        <div id="slide" class="slide">

          <div class="slide-title" id="slideTitle">
            Презентация жүктелмеді
          </div>

          <div class="slide-content" id="slideContent">
            PowerPoint файлын жүктеңіз.
          </div>

        </div>

        <div class="controls">

          <button id="prevBtn">
            ← Алдыңғы
          </button>

          <span id="slideNumber">
            0 / 0
          </span>

          <button id="nextBtn">
            Келесі →
          </button>

        </div>

        <div id="slideList" class="slide-list"></div>

      </div>

    </div>


    <div class="translation-panel">

      <h3>🌍 Аударма</h3>

      <div id="selectedWord" class="selected-word">
        Сөзді басыңыз
      </div>

      <div id="translation" class="translation">
        Презентациядағы кез келген сөзді басыңыз.
      </div>

      <button id="speakBtn" class="speak-button">
        🔊 Ағылшынша тыңдау
      </button>

    </div>

  </div>

</div>


<script>

  let slides = [];
  let currentSlide = 0;
  let selectedWord = "";


  const fileInput = document.getElementById("fileInput");
  const status = document.getElementById("status");
  const loading = document.getElementById("loading");

  const workspace = document.getElementById("workspace");

  const slideTitle = document.getElementById("slideTitle");
  const slideContent = document.getElementById("slideContent");

  const slideNumber = document.getElementById("slideNumber");
  const slideList = document.getElementById("slideList");

  const selectedWordElement =
    document.getElementById("selectedWord");

  const translationElement =
    document.getElementById("translation");

  const prevBtn =
    document.getElementById("prevBtn");

  const nextBtn =
    document.getElementById("nextBtn");

  const speakBtn =
    document.getElementById("speakBtn");


  /*
   * ==========================================
   * POWERPOINT FILE LOAD
   * ==========================================
   */

  fileInput.addEventListener("change", async function(event) {

    const file = event.target.files[0];

    if (!file) {
      return;
    }

    if (!file.name.toLowerCase().endsWith(".pptx")) {

      status.innerHTML =
        '<span class="error">❌ Тек .pptx файл таңдаңыз.</span>';

      return;
    }

    status.textContent =
      "Файл: " + file.name;

    loading.style.display = "block";

    workspace.style.display = "none";

    try {

      slides = await readPowerPoint(file);

      if (slides.length === 0) {

        throw new Error(
          "Презентациядан слайд табылмады."
        );

      }

      currentSlide = 0;

      workspace.style.display = "grid";

      renderSlide();

      createSlideList();

      loading.style.display = "none";

    } catch (error) {

      console.error(error);

      loading.style.display = "none";

      status.innerHTML =
        '<span class="error">❌ Қате: ' +
        escapeHTML(error.message) +
        '</span>';

    }

  });


  /*
   * ==========================================
   * READ PPTX
   * ==========================================
   */

  async function readPowerPoint(file) {

    const arrayBuffer =
      await file.arrayBuffer();

    const zip =
      await JSZip.loadAsync(arrayBuffer);

    const slideFiles = [];

    zip.forEach(function(relativePath, zipEntry) {

      if (
        /^ppt\/slides\/slide\d+\.xml$/i.test(relativePath)
      ) {

        slideFiles.push({
          path: relativePath,
          number: getSlideNumber(relativePath)
        });

      }

    });


    slideFiles.sort(function(a, b) {
      return a.number - b.number;
    });


    const result = [];


    for (const slideFile of slideFiles) {

      const xml =
        await zip
          .file(slideFile.path)
          .async("text");

      const parsed =
        parseSlideXML(xml);

      result.push(parsed);

    }


    return result;
  }


  function getSlideNumber(path) {

    const match =
      path.match(/slide(\d+)\.xml/i);

    return match
      ? Number(match[1])
      : 0;
  }


  /*
   * ==========================================
   * PARSE SLIDE XML
   * ==========================================
   */

  function parseSlideXML(xml) {

    const parser =
      new DOMParser();

    const doc =
      parser.parseFromString(
        xml,
        "application/xml"
      );


    const textNodes =
      Array.from(
        doc.getElementsByTagName("a:t")
      );


    const texts =
      textNodes
        .map(node => node.textContent || "")
        .filter(text => text.trim() !== "");


    if (texts.length === 0) {

      return {
        title: "",
        paragraphs: []
      };

    }


    const title =
      texts[0] || "";


    const paragraphs =
      texts.slice(1);


    return {
      title: title,
      paragraphs: paragraphs
    };

  }


  /*
   * ==========================================
   * SHOW SLIDE
   * ==========================================
   */

  function renderSlide() {

    if (!slides.length) {
      return;
    }

    const data =
      slides[currentSlide];


    slideTitle.textContent =
      data.title || "Untitled";


    slideContent.innerHTML = "";


    data.paragraphs.forEach(function(text) {

      const paragraph =
        document.createElement("div");

      paragraph.style.marginBottom = "12px";


      const words =
        text.split(/(\s+)/);


      words.forEach(function(part) {

        if (/^\s+$/.test(part)) {

          paragraph.appendChild(
            document.createTextNode(part)
          );

          return;
        }


        if (!part.trim()) {
          return;
        }


        const word =
          document.createElement("span");

        word.className = "word";

        word.textContent = part;


        word.addEventListener(
          "click",
          function() {

            selectWord(
              cleanWord(part)
            );

          }
        );


        paragraph.appendChild(word);

      });


      slideContent.appendChild(paragraph);

    });


    slideNumber.textContent =
      `${currentSlide + 1} / ${slides.length}`;


    updateSlideThumbnails();

  }


  /*
   * ==========================================
   * WORD SELECT
   * ==========================================
   */

  async function selectWord(word) {

    if (!word) {
      return;
    }

    selectedWord = word;

    selectedWordElement.textContent =
      word;

    translationElement.textContent =
      "⏳ Аударылып жатыр...";


    const translation =
      await translateWord(word);


    translationElement.textContent =
      translation;

  }


  function cleanWord(word) {

    return word
      .replace(/[.,!?;:"'“”«»()[\]{}]/g, "")
      .trim();

  }


  /*
   * ==========================================
   * TRANSLATION
   * ==========================================
   */

  async function translateWord(word) {

    try {

      const url =
        "https://api.mymemory.translated.net/get" +
        "?q=" +
        encodeURIComponent(word) +
        "&langpair=auto|en";


      const response =
        await fetch(url);


      if (!response.ok) {

        throw new Error(
          "Translation request failed"
        );

      }


      const data =
        await response.json();


      if (
        data &&
        data.responseData &&
        data.responseData.translatedText
      ) {

        return data.responseData.translatedText;

      }


      return "Аударма табылмады.";

    } catch (error) {

      console.error(error);

      return "⚠️ Аударма қызметіне қосылу мүмкін болмады.";

    }

  }


  /*
   * ==========================================
   * TEXT TO SPEECH
   * ==========================================
   */

  speakBtn.addEventListener(
    "click",
    function() {

      if (!selectedWord) {
        return;
      }


      if (!("speechSynthesis" in window)) {

        alert(
          "Бұл браузерде дыбыстап оқу қолжетімсіз."
        );

        return;

      }


      speechSynthesis.cancel();


      const speech =
        new SpeechSynthesisUtterance(
          selectedWord
        );


      speech.lang = "en-US";

      speech.rate = 0.85;

      speech.pitch = 1;


      speechSynthesis.speak(speech);

    }
  );


  /*
   * ==========================================
   * SLIDE NAVIGATION
   * ==========================================
   */

  prevBtn.addEventListener(
    "click",
    function() {

      if (currentSlide > 0) {

        currentSlide--;

        renderSlide();

      }

    }
  );


  nextBtn.addEventListener(
    "click",
    function() {

      if (
        currentSlide <
        slides.length - 1
      ) {

        currentSlide++;

        renderSlide();

      }

    }
  );


  /*
   * ==========================================
   * KEYBOARD NAVIGATION
   * ==========================================
   */

  document.addEventListener(
    "keydown",
    function(event) {

      if (!slides.length) {
        return;
      }


      if (event.key === "ArrowRight") {

        if (
          currentSlide <
          slides.length - 1
        ) {

          currentSlide++;

          renderSlide();

        }

      }


      if (event.key === "ArrowLeft") {

        if (currentSlide > 0) {

          currentSlide--;

          renderSlide();

        }

      }

    }
  );


  /*
   * ==========================================
   * SLIDE THUMBNAILS
   * ==========================================
   */

  function createSlideList() {

    slideList.innerHTML = "";


    slides.forEach(
      function(slide, index) {

        const thumb =
          document.createElement("div");


        thumb.className =
          "slide-thumb";


        thumb.textContent =
          `${index + 1}. ${slide.title}`;


        thumb.addEventListener(
          "click",
          function() {

            currentSlide = index;

            renderSlide();

          }
        );


        slideList.appendChild(thumb);

      }
    );

  }


  function updateSlideThumbnails() {

    const thumbnails =
      document.querySelectorAll(
        ".slide-thumb"
      );


    thumbnails.forEach(
      function(thumb, index) {

        if (index === currentSlide) {

          thumb.classList.add("active");

        } else {

          thumb.classList.remove("active");

        }

      }
    );

  }


  /*
   * ==========================================
   * SECURITY HELPER
   * ==========================================
   */

  function escapeHTML(text) {

    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }

</script>

</body>
</html>

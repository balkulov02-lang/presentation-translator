<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentation Translator</title>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #1f2937;
    }

    header {
      background: white;
      padding: 20px 40px;
      border-bottom: 1px solid #e5e7eb;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    main {
      max-width: 1100px;
      margin: 40px auto;
      padding: 20px;
    }

    .upload-box {
      background: white;
      border-radius: 24px;
      padding: 50px 30px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    .icon {
      font-size: 55px;
    }

    h2 {
      font-size: 30px;
    }

    .description {
      color: #6b7280;
      font-size: 17px;
      line-height: 1.6;
    }

    .upload-button {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 16px 30px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 17px;
      font-weight: bold;
      margin-top: 15px;
    }

    #fileInput {
      display: none;
    }

    #fileName {
      margin-top: 20px;
      font-weight: bold;
      color: #2563eb;
    }

    .status {
      margin-top: 20px;
      color: #6b7280;
    }

    .slide {
      background: white;
      border-radius: 18px;
      padding: 30px;
      margin-top: 25px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.07);
      text-align: left;
    }

    .slide-title {
      color: #2563eb;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .text-line {
      font-size: 18px;
      line-height: 1.9;
    }

    .word {
      cursor: pointer;
      padding: 3px;
      border-radius: 5px;
    }

    .word:hover {
      background: #dbeafe;
    }

    .translation-box {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      width: min(500px, 90%);
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      display: none;
      z-index: 1000;
      text-align: center;
    }

    .translation-word {
      font-size: 24px;
      font-weight: bold;
      color: #2563eb;
    }

    .translation-result {
      font-size: 21px;
      margin-top: 10px;
    }

    .close-button {
      margin-top: 15px;
      border: none;
      padding: 9px 18px;
      border-radius: 10px;
      cursor: pointer;
    }

    .info {
      margin-top: 30px;
      padding: 20px;
      background: #eff6ff;
      border-radius: 14px;
      text-align: left;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<header>
  <h1>📚 Presentation Translator</h1>
</header>

<main>

  <div class="upload-box">

    <div class="icon">📊</div>

    <h2>Презентацияны аудар</h2>

    <p class="description">
      PowerPoint презентациясын жүкте.<br>
      Презентациядағы сөзді басып,
      ағылшынша аудармасын көр.
    </p>

    <label class="upload-button" for="fileInput">
      📂 Презентация жүктеу
    </label>

    <input type="file" id="fileInput" accept=".pptx">

    <div id="fileName"></div>

    <div id="status" class="status"></div>

    <div id="presentation"></div>

    <div class="info">
      💡 <strong>Қалай жұмыс істейді?</strong><br><br>
      1. PowerPoint жүктейсің.<br>
      2. Слайдтағы мәтін оқылады.<br>
      3. Кез келген сөзді басасың.<br>
      4. Ағылшынша аудармасы шығады.
    </div>

  </div>

</main>

<div id="translationBox" class="translation-box">

  <div id="translationWord" class="translation-word"></div>

  <div id="translationResult" class="translation-result"></div>

  <button class="close-button" onclick="closeTranslation()">
    Жабу
  </button>

</div>

<script>

const fileInput = document.getElementById("fileInput");
const fileName = document.getElementById("fileName");
const statusBox = document.getElementById("status");
const presentation = document.getElementById("presentation");

const translationBox = document.getElementById("translationBox");
const translationWord = document.getElementById("translationWord");
const translationResult = document.getElementById("translationResult");

fileInput.addEventListener("change", async function() {

  if (!fileInput.files.length) return;

  const file = fileInput.files[0];

  fileName.textContent =
    "✅ Таңдалған файл: " + file.name;

  presentation.innerHTML = "";

  statusBox.textContent =
    "⏳ Презентация оқылып жатыр...";

  try {

    await readPowerPoint(file);

    statusBox.textContent =
      "✅ Дайын! Сөзді басып көр.";

  } catch (error) {

    console.error(error);

    statusBox.textContent =
      "❌ Презентацияны оқу кезінде қате болды.";

  }

});

async function readPowerPoint(file) {

  const arrayBuffer = await file.arrayBuffer();

  const zip = await JSZip.loadAsync(arrayBuffer);

  const slides = [];

  zip.forEach(function(path, entry) {

    const match =
      path.match(/^ppt\/slides\/slide(\d+)\.xml$/);

    if (match) {

      slides.push({
        number: Number(match[1]),
        entry: entry
      });

    }

  });

  slides.sort((a, b) => a.number - b.number);

  for (const slide of slides) {

    const xmlText =
      await slide.entry.async("text");

    createSlide(slide.number, xmlText);

  }

}

function createSlide(number, xmlText) {

  const parser = new DOMParser();

  const xml =
    parser.parseFromString(xmlText, "application/xml");

  const textNodes =
    Array.from(xml.getElementsByTagName("a:t"));

  const slide =
    document.createElement("div");

  slide.className = "slide";

  const title =
    document.createElement("div");

  title.className = "slide-title";

  title.textContent =
    "Слайд " + number;

  slide.appendChild(title);

  const line =
    document.createElement("div");

  line.className = "text-line";

  if (textNodes.length === 0) {

    line.textContent =
      "Бұл слайдта мәтін жоқ.";

  } else {

    textNodes.forEach(function(node) {

      const text =
        node.textContent.trim();

      if (!text) return;

      const words =
        text.split(/(\s+)/);

      words.forEach(function(part) {

        if (/^\s+$/.test(part)) {

          line.appendChild(
            document.createTextNode(part)
          );

        } else {

          const word =
            document.createElement("span");

          word.className = "word";

          word.textContent = part;

          word.onclick = function() {

            translateWord(
              cleanWord(part)
            );

          };

          line.appendChild(word);

        }

      });

      line.appendChild(
        document.createElement("br")
      );

    });

  }

  slide.appendChild(line);

  presentation.appendChild(slide);

}

function cleanWord(word) {

  return word
    .replace(/[.,!?;:"“”«»()[\]{}]/g, "")
    .trim();

}

async function translateWord(word) {

  if (!word) return;

  translationBox.style.display = "block";

  translationWord.textContent = word;

  const dictionary = {

    "тарих": "history",
    "ғылым": "science",
    "технология": "technology",
    "технологиялар": "technologies",
    "білім": "education",
    "өмір": "life",
    "өзгеріс": "change",
    "мектеп": "school",
    "мұғалім": "teacher",
    "оқушы": "student",
    "ғасыр": "century",
    "әлем": "world"

  };

  const key =
    word.toLowerCase();

  if (dictionary[key]) {

    translationResult.textContent =
      "🇬🇧 " + dictionary[key];

    return;
  }

  translationResult.textContent =
    "⏳ Аударылып жатыр...";

  try {

    const url =
      "https://api.mymemory.translated.net/get?q=" +
      encodeURIComponent(word) +
      "&langpair=kk|en";

    const response =
      await fetch(url);

    const data =
      await response.json();

    if (
      data &&
      data.responseData &&
      data.responseData.translatedText
    ) {

      translationResult.textContent =
        "🇬🇧 " +
        data.responseData.translatedText;

    } else {

      translationResult.textContent =
        "Аударма табылмады.";

    }

  } catch (error) {

    translationResult.textContent =
      "❌ Аударма қызметі қолжетімсіз.";

  }

}

function closeTranslation() {

  translationBox.style.display = "none";

}

</script>

</body>
</html>
